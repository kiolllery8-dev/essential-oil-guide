name: Isolated build attempt identity fixture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-build:
    if: ${{ github.ref != 'refs/heads/master' }}
    runs-on: ubuntu-latest
    outputs:
      artifact_attempt: ${{ steps.identity.outputs.artifact_attempt }}
    steps:
      - name: Record original build identity
        id: identity
        env:
          BUILD_RUN: ${{ github.run_id }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os
          with open('fixture-identity.json', 'w') as f:
              json.dump({'runId': os.environ['BUILD_RUN'], 'buildAttempt': os.environ['BUILD_ATTEMPT']}, f)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('artifact_attempt=' + os.environ['BUILD_ATTEMPT'] + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: attempt-identity-fixture
          path: fixture-identity.json
          retention-days: 7
  fixture-verify:
    if: ${{ github.ref != 'refs/heads/master' }}
    needs: fixture-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: attempt-identity-fixture
      - name: Compare original build output with retained artifact
        env:
          CURRENT_RUN: ${{ github.run_id }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
          ORIGINAL_BUILD_ATTEMPT: ${{ needs.fixture-build.outputs.artifact_attempt }}
        run: |
          python3 - <<'PY'
          import json, os
          identity = json.load(open('fixture-identity.json'))
          assert identity['runId'] == os.environ['CURRENT_RUN']
          assert identity['buildAttempt'] == os.environ['ORIGINAL_BUILD_ATTEMPT']
          print(json.dumps({'currentAttempt': os.environ['CURRENT_ATTEMPT'], 'originalBuildAttempt': os.environ['ORIGINAL_BUILD_ATTEMPT'], 'artifact': identity}))
          if os.environ['CURRENT_ATTEMPT'] == '1':
              raise SystemExit('Intentional isolated fixture failure: rerun only this failed job')
          assert os.environ['CURRENT_ATTEMPT'] == '2'
          assert identity['buildAttempt'] == '1'
          PY
